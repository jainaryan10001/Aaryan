<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | Aryan AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

body{
    background:#f5f7fa;
}

.register-card{

    max-width:450px;
    margin:auto;
    margin-top:50px;
    padding:30px;
    border-radius:20px;

}

</style>

</head>

<body>

<div class="container">

<div class="card shadow register-card">

<h2 class="text-center mb-4">

Create Account

</h2>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password"
required>

</div>

<button
type="submit"
class="btn btn-success w-100">

Create Account

</button>

</form>

<hr>

<p class="text-center">

Or Sign Up With

</p>

<div class="d-grid gap-2">

<button
type="button"
id="googleLogin"
class="btn btn-danger">

<i class="fab fa-google"></i>

Continue with Google

</button>

</div>

<div class="text-center mt-4">

Already have an account?

<a href="login.html">

Login

</a>

</div>

<div class="text-center mt-3">

<a href="index.html">

← Back Home

</a>

</div>

</div>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
