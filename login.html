<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Aryan AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">

<div class="overlay"></div>

<div class="container-fluid">

<div class="row min-vh-100 align-items-center">

<!-- Left Side -->

<div class="col-lg-7 left-panel d-none d-lg-flex">

<div class="hero-content">

<div class="logo-circle">
<i class="fa-solid fa-microchip"></i>
</div>

<h1>Aryan AI</h1>

<p>
Smart AI Solutions<br>
Artificial Intelligence • Computer Vision • Machine Learning
</p>

<div class="hero-buttons">

<a href="index.html" class="btn btn-outline-light">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="video.html" class="btn btn-primary">
Projects
</a>

</div>

</div>

</div>

<!-- Right Side -->

<div class="col-lg-5 d-flex justify-content-center">

<div class="login-card">

<div class="text-center mb-4">

<div class="login-logo">

<i class="fa-solid fa-user-astronaut"></i>

</div>

<h2>Welcome Back</h2>

<p>
Sign in to continue to Aryan AI
</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label>Email Address</label>

<div class="input-group">

<span class="input-group-text">
<i class="fa-solid fa-envelope"></i>
</span>

<input
type="email"
class="form-control"
id="email"
placeholder="Enter your email"
required>

</div>

</div>

<div class="mb-3">

<label>Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="fa-solid fa-lock"></i>
</span>

<input
type="password"
class="form-control"
id="password"
placeholder="Enter password"
required>

<button
class="btn btn-dark"
type="button"
id="togglePassword">

<i class="fa-solid fa-eye"></i>

</button>

</div>

</div>

<div class="d-flex justify-content-between mb-3">

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
id="remember">

<label class="form-check-label">

Remember Me

</label>

</div>

<a href="#">
Forgot Password?
</a>

</div>

<button
type="submit"
class="btn btn-login w-100">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button
class="btn btn-google w-100"
id="googleLogin">

<i class="fab fa-google"></i>

Continue with Google

</button>

<button
class="btn btn-github w-100 mt-3">

<i class="fab fa-github"></i>

Continue with GitHub

</button>

<p class="text-center mt-4">

Don't have an account?

<a href="register.html">

Register

</a>

</p>

<div class="text-center mt-3">

<a href="index.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Home

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
